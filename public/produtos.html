<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Produtos — Focinho Feliz</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-nav="">
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<div id="ff-header"></div>

<main class="page" id="main" aria-label="Conteúdo principal">
  <div class="wrap">
    <nav class="breadcrumb" id="breadcrumb"><a href="/">Início</a> · Produtos</nav>
    <h1 id="tituloCatalogo">Produtos</h1>

    <div class="catalogo">
      <aside class="filtros" id="filtros">
        <div class="filtros__grupo" style="display:flex;justify-content:space-between;align-items:center;">
          <strong>Filtros</strong>
          <button class="btn-icone" id="fecharFiltros" style="display:none;">Fechar ✕</button>
        </div>
        <div class="filtros__grupo">
          <p class="filtros__titulo">Seções</p>
          <div class="filtros__lista" id="fSecoes"></div>
        </div>
        <div class="filtros__grupo" id="grpSub" hidden>
          <p class="filtros__titulo">Tipo</p>
          <div class="filtros__lista" id="fSub"></div>
        </div>
        <div class="filtros__grupo">
          <p class="filtros__titulo">Para</p>
          <div class="filtros__lista" id="fEspecie"></div>
        </div>
        <div class="filtros__grupo">
          <p class="filtros__titulo">Marca</p>
          <div class="filtros__lista" id="fMarca"></div>
        </div>
        <div class="filtros__grupo">
          <p class="filtros__titulo">Preço</p>
          <div class="filtros__preco">
            <input type="number" id="fPrecoMin" placeholder="mín" min="0" />
            <span>—</span>
            <input type="number" id="fPrecoMax" placeholder="máx" min="0" />
          </div>
        </div>
        <div class="filtros__grupo">
          <label class="filtros__check"><input type="checkbox" id="fPromo" /> Somente em oferta</label>
          <label class="filtros__check" style="margin-top:8px"><input type="checkbox" id="fAval" /> Avaliação 4★ ou mais</label>
        </div>
        <div class="filtros__acoes">
          <button class="btn btn--primary btn--pequeno btn--bloco" id="aplicarFiltros">Aplicar</button>
          <button class="btn btn--suave btn--pequeno" id="limparFiltros">Limpar</button>
        </div>
      </aside>

      <div>
        <div class="catalogo__topo">
          <button class="btn btn--suave btn--pequeno filtros-mobile-btn" id="abrirFiltros">⚙ Filtros</button>
          <span class="catalogo__contagem" id="contagem">Carregando…</span>
          <label>
            <select class="ordenar-sel" id="ordenar">
              <option value="relevancia">Ordenar: Relevância</option>
              <option value="menor-preco">Menor preço</option>
              <option value="maior-preco">Maior preço</option>
              <option value="avaliacao">Melhor avaliados</option>
              <option value="nome">Nome (A–Z)</option>
            </select>
          </label>
        </div>
        <div class="chips" id="chips"></div>
        <div id="grade"></div>
        <div class="paginacao" id="paginacao"></div>
      </div>
    </div>
  </div>
</main>

<footer id="ff-footer"></footer>
<div id="ff-toasts" class="toasts"></div>
<div class="scrim" id="scrimFiltros" hidden></div>

<script src="/js/core.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/componentes.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/catalogo.js"></script>
</body>
</html>
