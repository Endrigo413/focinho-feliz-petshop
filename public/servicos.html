<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Serviços — Focinho Feliz</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-nav="servicos">
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<div id="ff-header"></div>

<main class="page" id="main" aria-label="Conteúdo principal">
  <div class="wrap">
    <nav class="breadcrumb"><a href="/">Início</a> · Serviços</nav>
    <h1>Clínica veterinária, banho e tosa</h1>
    <p style="max-width:60ch;color:var(--ink-soft)">Escolha o serviço, informe os dados do seu pet e a data desejada. Confirmamos o horário por telefone. É preciso estar logado para agendar.</p>

    <div class="chips" id="filtroServicos" style="margin:16px 0"></div>
    <div class="servicos-grade" id="grade"><p class="vazio">Carregando serviços…</p></div>
  </div>
</main>

<footer id="ff-footer"></footer>
<div id="ff-toasts" class="toasts"></div>

<div class="modal-scrim" id="modalAgendar" hidden>
  <div class="modal-box">
    <div class="modal-box__head">
      <h2 id="modalTitulo">Agendar serviço</h2>
      <button class="modal-box__fechar" data-fechar>✕</button>
    </div>
    <form id="formAgendar">
      <input type="hidden" name="servicoId" />
      <div class="campo-linha">
        <label class="campo">Seu nome<input name="nome" required /></label>
        <label class="campo">Telefone / WhatsApp<input name="telefone" placeholder="(12) 90000-0000" required /></label>
      </div>
      <div class="campo-linha">
        <label class="campo">Nome do pet<input name="petNome" required /></label>
        <label class="campo">Espécie
          <select name="petEspecie"><option value="cachorro">Cachorro</option><option value="gato">Gato</option><option value="outro">Outro</option></select>
        </label>
      </div>
      <div class="campo-linha">
        <label class="campo">Data<input type="date" name="data" required /></label>
        <label class="campo">Horário<input type="time" name="horario" required /></label>
      </div>
      <label class="campo">Observações (opcional)<textarea name="observacoes" placeholder="Alergias, comportamento, preferências…"></textarea></label>
      <button type="submit" class="btn btn--primary btn--bloco">Confirmar agendamento</button>
      <p class="form-msg" id="msgAgendar" role="status"></p>
    </form>
  </div>
</div>

<script src="/js/core.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/componentes.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/servicos.js"></script>
</body>
</html>
