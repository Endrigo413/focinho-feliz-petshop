<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Criar conta — Focinho Feliz</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-nav="" data-conta="criar">
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<div id="ff-header"></div>

<main class="page" id="main" aria-label="Conteúdo principal">
  <div class="wrap">
    <div class="form-card">
      <div class="passos"><span class="is-feito"></span><span></span></div>
      <h1>Criar conta</h1>
      <p class="form-card__sub">Passo 1 de 2 — seus dados. Depois confirmamos seu e-mail com um código.</p>
      <form id="formConta">
        <label class="campo">Nome completo<input name="nome" autocomplete="name" required /></label>
        <label class="campo">E-mail<input type="email" name="email" autocomplete="email" required /></label>
        <label class="campo">Telefone / WhatsApp (opcional)<input type="tel" name="telefone" autocomplete="tel" placeholder="(12) 90000-0000" /></label>
        <label class="campo">Senha (mínimo 6 caracteres)<input type="password" name="senha" autocomplete="new-password" minlength="6" required /></label>
        <button type="submit" class="btn btn--primary btn--bloco">Continuar</button>
        <p class="form-msg" id="msg" role="status"></p>
      </form>
      <div class="form-links"><a href="/conta/entrar">Já tenho conta</a></div>
    </div>
  </div>
</main>

<footer id="ff-footer"></footer>
<div id="ff-toasts" class="toasts"></div>

<script src="/js/core.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/componentes.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/conta.js"></script>
</body>
</html>
