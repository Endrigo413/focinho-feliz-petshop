<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Confirmar e-mail — Focinho Feliz</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-nav="" data-conta="confirmar">
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<div id="ff-header"></div>

<main class="page" id="main" aria-label="Conteúdo principal">
  <div class="wrap">
    <div class="form-card">
      <div class="passos"><span class="is-feito"></span><span class="is-feito"></span></div>
      <h1>Confirme seu e-mail</h1>
      <p class="form-card__sub">Enviamos um código de 6 dígitos para <strong id="alvoEmail">seu e-mail</strong>. Digite abaixo para ativar sua conta.</p>
      <form id="formConta">
        <input type="hidden" name="email" />
        <label class="campo codigo-input">Código de confirmação
          <input name="codigo" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
        </label>
        <button type="submit" class="btn btn--primary btn--bloco">Confirmar e entrar</button>
        <p class="form-msg" id="msg" role="status"></p>
      </form>
      <div class="form-links">
        <button type="button" class="btn btn--suave btn--pequeno" id="reenviar">Reenviar código</button>
        <a href="/conta/entrar">Voltar ao login</a>
      </div>
    </div>
  </div>
</main>

<footer id="ff-footer"></footer>
<div id="ff-toasts" class="toasts"></div>

<script src="/js/core.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/componentes.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/conta.js"></script>
</body>
</html>
