<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recuperar senha — Focinho Feliz</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-nav="" data-conta="recuperar">
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<div id="ff-header"></div>

<main class="page" id="main" aria-label="Conteúdo principal">
  <div class="wrap">
    <div class="form-card">
      <h1>Recuperar senha</h1>

      <form id="formEmail">
        <p class="form-card__sub">Informe seu e-mail. Enviaremos um código para você criar uma nova senha.</p>
        <label class="campo">E-mail<input type="email" name="email" autocomplete="email" required /></label>
        <button type="submit" class="btn btn--primary btn--bloco">Enviar código</button>
        <p class="form-msg" id="msg1" role="status"></p>
      </form>

      <form id="formNova" hidden>
        <p class="form-card__sub">Digite o código recebido e a nova senha.</p>
        <input type="hidden" name="email" />
        <label class="campo codigo-input">Código<input name="codigo" inputmode="numeric" maxlength="6" required /></label>
        <label class="campo">Nova senha (mínimo 6 caracteres)<input type="password" name="novaSenha" minlength="6" autocomplete="new-password" required /></label>
        <button type="submit" class="btn btn--primary btn--bloco">Redefinir e entrar</button>
        <p class="form-msg" id="msg2" role="status"></p>
      </form>

      <div class="form-links"><a href="/conta/entrar">Voltar ao login</a></div>
    </div>
  </div>
</main>

<footer id="ff-footer"></footer>
<div id="ff-toasts" class="toasts"></div>

<script src="/js/core.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/componentes.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/conta.js"></script>
</body>
</html>
